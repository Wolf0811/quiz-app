name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
              autoconf libtool libssl-dev libltdl-dev python3-dev
          python3 -m pip install --upgrade pip setuptools wheel
          # 只安装 Cython 和 buildozer，不安装 kivy
          python3 -m pip install --upgrade "Cython==0.29.33" virtualenv buildozer

      # 新增步骤：下载 Kivy 2.1.0 源码，供 p4a 编译时使用
      - name: Download Kivy source
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/kivy/kivy.git /tmp/kivy
          echo "P4A_KIVY_DIR=/tmp/kivy" >> $GITHUB_ENV
          
      - name: Build APK
        run: |
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r28c"
          buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizApp-APK
          path: bin/*.apk
